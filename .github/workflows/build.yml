name: Android build
on:
  push:
    branches: [ android-fixes ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ android-fixes ]
  workflow_dispatch:
    inputs:
      sign_release:
        description: Build and sign a non-debuggable release APK using GitHub Actions secrets
        type: boolean
        required: false
        default: false
      release_version:
        description: Semantic version MAJOR.MINOR.PATCH (required when sign_release is true)
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Verify source and shell consistency
        run: |
          bash scripts/verify-stage0.sh
          bash scripts/verify-stage1.sh
          bash scripts/verify-stage2.sh
          bash scripts/verify-stage3.sh
          bash scripts/verify-stage4.sh
          bash scripts/verify-stage5.sh
          bash scripts/verify-stage6.sh
          bash scripts/verify-stage7.sh
          bash scripts/verify-stage8.sh
          bash scripts/verify-stage9.sh
          bash scripts/verify-stage10.sh
          bash scripts/verify-stage11.sh
          bash scripts/verify-stage12.sh
          bash scripts/verify-stage13.sh
          bash scripts/verify-stage14.sh
          bash scripts/verify-stage15.sh
      - name: Set up Java 8 for the legacy Ant/NDK build
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y make ant ant-contrib python3 python3-yaml unzip binutils coreutils shellcheck golang-go lib32z1 lib32stdc++6 lib32ncurses6
      - name: Run JVM tests and lint workflow
        run: |
          set -euo pipefail
          bash scripts/test-java.sh
          shellcheck --severity=error build.sh scripts/*.sh
          python3 scripts/validate-workflow.py
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/build.yml
      - name: Enforce release license clearance
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign_release) }}
        run: python3 scripts/verify-release-license-gate.py
      - name: Fetch native build dependencies at locked revisions
        run: bash scripts/fetch-build-deps.sh
      - name: Prepare release version
        id: release_version
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign_release) }}
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="${REQUESTED_RELEASE_VERSION:-}"
          fi
          python3 scripts/prepare-release-version.py "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build, verify APK, and record checksums
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/workflow.sh
          test -s bin/srceng-debug.apk
          test -s build-reports/build-metadata.txt
          test -s build-reports/SHA256SUMS
          cat build-reports/build-metadata.txt
          cat build-reports/SHA256SUMS
      - name: Check debug artifact distribution clearance
        id: debug_artifact_clearance
        if: success()
        run: |
          if python3 scripts/verify-release-license-gate.py; then
            printf 'eligible=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'eligible=false\n' >> "$GITHUB_OUTPUT"
            echo 'Debug APK built for CI verification; public artifact withheld because redistribution clearance is blocked.'
          fi
      - name: Upload verified debug APK and build report
        if: ${{ success() && steps.debug_artifact_clearance.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-engine-android-debug
          path: |
            bin/srceng-debug.apk
            build-reports/build-metadata.txt
            build-reports/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Build non-debuggable release APK
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign_release) }}
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -euo pipefail
          ant -Dsdk.dir="$ANDROID_HOME" clean release
          test -s bin/srceng-release-unsigned.apk || { echo 'ERROR: Ant did not produce bin/srceng-release-unsigned.apk.' >&2; exit 1; }
      - name: Sign and verify release APK using repository secrets
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign_release) }}
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          MY_KEYSTORE_JKS: ${{ secrets.MY_KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          set +x
          for name in MY_KEYSTORE_JKS KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            case "$name" in
              MY_KEYSTORE_JKS) value="${MY_KEYSTORE_JKS:-}" ;;
              KEYSTORE_PASSWORD) value="${KEYSTORE_PASSWORD:-}" ;;
              KEY_ALIAS) value="${KEY_ALIAS:-}" ;;
              KEY_PASSWORD) value="${KEY_PASSWORD:-}" ;;
            esac
            if [[ -z "$value" ]]; then
              printf 'ERROR: Required GitHub Actions secret is missing: %s\n' "$name" >&2
              exit 2
            fi
          done
          keystore="$(mktemp "$RUNNER_TEMP/source-engine-release-XXXXXX.jks")"
          unsigned_apk="$GITHUB_WORKSPACE/bin/srceng-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/srceng-release-aligned.apk"
          signed_apk="$GITHUB_WORKSPACE/bin/srceng-release.apk"
          trap 'rm -f "$keystore" "$unsigned_apk" "$aligned_apk"' EXIT
          printf '%s' "$MY_KEYSTORE_JKS" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore" || { echo 'ERROR: MY_KEYSTORE_JKS did not decode to a non-empty keystore.' >&2; exit 2; }
          zipalign="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign -print 2>/dev/null | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt -print 2>/dev/null | sort -V | tail -n 1)"
          for tool in "$zipalign" "$apksigner" "$aapt"; do
            [[ -n "$tool" && -x "$tool" ]] || { echo 'ERROR: Required Android build tool (zipalign, apksigner, or aapt) is unavailable.' >&2; exit 2; }
          done
          "$zipalign" -f 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$signed_apk" "$aligned_apk"
          mkdir -p build-reports
          "$apksigner" verify --verbose --print-certs "$signed_apk" > build-reports/release-signature.txt
          badging="$("$aapt" dump badging "$signed_apk")"
          printf '%s\n' "$badging" | grep -Fq "package: name='com.magd.source.engine'" || { echo 'ERROR: Signed release APK has the wrong application ID.' >&2; exit 1; }
          printf '%s\n' "$badging" | grep -Fq "versionName='$RELEASE_VERSION'" || { echo 'ERROR: Signed release APK has the wrong versionName.' >&2; exit 1; }
          if printf '%s\n' "$badging" | grep -Fq 'application-debuggable'; then
            echo 'ERROR: Refusing to label a debuggable APK as a release.' >&2
            exit 1
          fi
          AAPT="$aapt" bash scripts/verify-apk.sh "$signed_apk"
          { printf 'release_version=%s\n' "$RELEASE_VERSION"; printf 'signature_verification=passed\n'; printf 'source_commit=%s\n' "$GITHUB_SHA"; } > build-reports/release-metadata.txt
          echo 'Non-debuggable release APK signing and identity checks passed.'
      - name: Upload signed release APK and verification reports
        if: ${{ success() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign_release)) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-engine-android-release-${{ steps.release_version.outputs.version }}
          path: |
            bin/srceng-release.apk
            build-reports/build-metadata.txt
            build-reports/SHA256SUMS
            build-reports/release-signature.txt
            build-reports/release-metadata.txt
          if-no-files-found: error
          retention-days: 30
