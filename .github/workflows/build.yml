name: Android build
on:
  push:
    branches: [ android-fixes ]
  pull_request:
    branches: [ android-fixes ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Verify source and shell consistency
        run: |
          bash scripts/verify-stage0.sh
          bash scripts/verify-stage1.sh
          bash scripts/verify-stage2.sh
          bash scripts/verify-stage3.sh
          bash scripts/verify-stage4.sh
          bash scripts/verify-stage5.sh
          bash scripts/verify-stage6.sh
          bash scripts/verify-stage7.sh
          bash scripts/verify-stage8.sh
          bash scripts/verify-stage9.sh
      - name: Set up Java 8 for the legacy Ant/NDK build
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y make ant ant-contrib python3 unzip binutils coreutils lib32z1 lib32stdc++6 lib32ncurses6
      - name: Fetch native build dependencies at locked revisions
        run: bash scripts/fetch-build-deps.sh
      - name: Build, verify APK, and record checksums
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/workflow.sh
          test -s bin/srceng-debug.apk
          test -s build-reports/build-metadata.txt
          test -s build-reports/SHA256SUMS
          cat build-reports/build-metadata.txt
          cat build-reports/SHA256SUMS
      - name: Upload verified debug APK and build report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-engine-android-debug
          path: |
            bin/srceng-debug.apk
            build-reports/build-metadata.txt
            build-reports/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
