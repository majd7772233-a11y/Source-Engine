name: Android build

on:
  push:
    branches: [ android-fixes ]
  pull_request:
    branches: [ android-fixes ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 8 for the legacy Ant/NDK build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y make ant ant-contrib python3 python3-pip

      - name: Fetch required SDK, NDK toolchain, and Source SDK
        run: |
          git clone --depth 1 https://gitlab.com/LostGamer/ndk-binaries
          git clone --depth 1 https://gitlab.com/LostGamer/android-sdk
          git clone --depth 1 https://github.com/nillerusr/srcsdk
          git -C srcsdk submodule update --init --recursive

      - name: Build native libraries and Android APK
        env:
          COMMIT: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          bash scripts/workflow.sh
          test -s bin/srceng-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: source-engine-android-debug
          path: bin/srceng-debug.apk
          if-no-files-found: error
          retention-days: 14
