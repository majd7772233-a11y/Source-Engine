name: Android build
on:
  push:
    branches: [ android-fixes ]
  pull_request:
    branches: [ android-fixes ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Verify source and shell consistency
        run: |
          bash scripts/verify-stage0.sh
          bash scripts/verify-stage1.sh
      - name: Set up Java 8 for the legacy Ant/NDK build
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y make ant ant-contrib python3 unzip binutils coreutils lib32z1 lib32stdc++6 lib32ncurses6
      - name: Fetch native build dependencies
        env:
          SOURCE_SDK_COMMIT: 413f5848d9a4534cdf8a4d10f5c1e7b1eaf3835d
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.com/LostGamer/ndk-binaries.git ndk-binaries
          git clone --depth 1 https://gitlab.com/LostGamer/android-sdk.git android-sdk
          git clone https://github.com/nillerusr/srcsdk.git srcsdk
          git -C srcsdk checkout --detach "$SOURCE_SDK_COMMIT"
          git -C srcsdk submodule update --init --recursive
          {
            echo "NDK_BINARIES_COMMIT=$(git -C ndk-binaries rev-parse HEAD)"
            echo "ANDROID_SDK_COMMIT=$(git -C android-sdk rev-parse HEAD)"
            echo "SOURCE_SDK_COMMIT=$(git -C srcsdk rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "Resolved native dependency revisions:"
          git -C ndk-binaries log -1 --format='%H %s'
          git -C android-sdk log -1 --format='%H %s'
          git -C srcsdk log -1 --format='%H %s'
          git -C srcsdk submodule status --recursive
      - name: Build, verify APK, and record checksums
        env:
          ANDROID_HOME: \${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: \${{ github.workspace }}/android-sdk
          COMMIT: \${{ github.sha }}
          BUILD_BRANCH: \${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/workflow.sh
          test -s bin/srceng-debug.apk
          test -s build-reports/build-metadata.txt
          test -s build-reports/SHA256SUMS
          cat build-reports/build-metadata.txt
          cat build-reports/SHA256SUMS
      - name: Upload verified debug APK and build report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-engine-android-debug
          path: |
            bin/srceng-debug.apk
            build-reports/build-metadata.txt
            build-reports/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
