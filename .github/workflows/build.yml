name: Android build

on:
  push:
    branches: [ android-fixes ]
  pull_request:
    branches: [ android-fixes ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Stage 0 source, manifest, and shell consistency
        run: bash scripts/verify-stage0.sh

      - name: Set up Java 8 for the legacy Ant/NDK build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y make ant ant-contrib python3 python3-pip lib32z1 lib32stdc++6 lib32ncurses6

      - name: Fetch required SDK, NDK toolchain, and Source SDK
        run: |
          git clone --depth 1 https://gitlab.com/LostGamer/ndk-binaries
          git clone --depth 1 https://gitlab.com/LostGamer/android-sdk
          git clone --depth 1 https://github.com/nillerusr/srcsdk
          git -C srcsdk submodule update --init --recursive

      - name: Build native libraries and Android APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          COMMIT: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          bash scripts/workflow.sh
          test -s bin/srceng-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging bin/srceng-debug.apk | grep -F "package: name='com.magd.source.engine'"
          APK_FILES="$(unzip -Z1 bin/srceng-debug.apk)"
          for library in libtierhook.so libmain.so libRegal.so libclient.so libserver.so; do
            printf '%s\n' "$APK_FILES" | grep -Fx "lib/armeabi-v7a/$library" >/dev/null || {
              echo "Missing expected native library in APK: $library" >&2
              exit 1
            }
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: source-engine-android-debug
          path: bin/srceng-debug.apk
          if-no-files-found: error
          retention-days: 14
